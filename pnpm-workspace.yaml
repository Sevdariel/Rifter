packages:
  - 'apps/*'
  - 'packages/*'

# Supply-chain gate: skip releases published less than 7 days ago (minutes).
minimumReleaseAge: 10080

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  # Transitive deps of @testcontainers/postgresql whose install scripts we do
  # not need (SSH tunneling, protobuf codegen). Listed so installs don't fail
  # with ERR_PNPM_IGNORED_BUILDS.
  cpu-features: false
  protobufjs: false
  ssh2: false
