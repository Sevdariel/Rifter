name: rifter

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rifter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rifter}
      POSTGRES_DB: ${POSTGRES_DB:-rifter}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - rifter-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      # The container must listen on all interfaces for the published port;
      # the loopback default applies to the host dev server.
      HOST: 0.0.0.0
      # Dev default only; set API_AUTH_TOKEN in .env to override.
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-rifter-dev-token}
      DATABASE_URL: postgres://${POSTGRES_USER:-rifter}:${POSTGRES_PASSWORD:-rifter}@db:5432/${POSTGRES_DB:-rifter}
      DEV_PUUID: ${DEV_PUUID:-}
      RIOT_API_KEY: ${RIOT_API_KEY:-}
      RIOT_REGIONAL_ROUTE: ${RIOT_REGIONAL_ROUTE:-europe}
      RIOT_PLATFORM_ROUTE: ${RIOT_PLATFORM_ROUTE:-euw1}
    # Loopback-only publish: the API stays unreachable from LAN.
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '127.0.0.1:4200:80'

  # Local observability stack: `docker compose --profile observability up`.
  # Alloy tails container logs into Loki; Prometheus scrapes the API's
  # /metrics; Grafana exposes both on 127.0.0.1:3001.
  loki:
    image: grafana/loki:3.4.3
    profiles: [observability]
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./deploy/observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - rifter-loki:/loki
    ports:
      - '127.0.0.1:3100:3100'

  prometheus:
    image: prom/prometheus:v3.4.0
    profiles: [observability]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - rifter-prometheus:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
    depends_on:
      - api

  alloy:
    image: grafana/alloy:v1.9.2
    profiles: [observability]
    # Docker Desktop maps the Windows named pipe onto the unix socket path.
    volumes:
      - ./deploy/observability/config.alloy:/etc/alloy/config.alloy:ro
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/tmp/alloy /etc/alloy/config.alloy
    ports:
      - '127.0.0.1:12345:12345'
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.0.2
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - rifter-grafana:/var/lib/grafana
      - ./deploy/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      - loki
      - prometheus

volumes:
  rifter-pgdata:
  rifter-loki:
  rifter-prometheus:
  rifter-grafana:
